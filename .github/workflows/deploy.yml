name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply class-roster-vault --remote --yes

      - name: Deploy Worker and assets
        run: npx wrangler deploy --yes

      - name: Set roster password
        env:
          ROSTER_PASSWORD: ${{ secrets.ROSTER_PASSWORD }}
        run: |
          test -n "$ROSTER_PASSWORD"
          printf '%s' "$ROSTER_PASSWORD" | npx wrangler secret put ROSTER_PASSWORD
